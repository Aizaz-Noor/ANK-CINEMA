[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────
[project]
name            = "ank-cinema"
version         = "3.0.0"
description     = "Cross-platform P2P download accelerator with terminal UI"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.8"

authors = [
    { name = "Aizaz Noor", email = "aizaznoor@proton.me" }
]

keywords = [
    "cli", "downloader", "aria2", "torrent", "terminal",
    "p2p", "bittorrent", "rich", "cross-platform"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Utilities",
]

dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
]

# ── Optional extras ───────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

# ── Entry point — this is the key part ───────────────────
# After `pip install ank-cinema`, the user can type `ank-cinema`
# in any terminal on any OS and this function is called directly.
[project.scripts]
ank-cinema = "ank_cinema_core:main"

# ── URLs ─────────────────────────────────────────────────
[project.urls]
Homepage   = "https://github.com/aizaznoor/ANK-CINEMA"
Repository = "https://github.com/aizaznoor/ANK-CINEMA"
Issues     = "https://github.com/aizaznoor/ANK-CINEMA/issues"

# ── Setuptools config ─────────────────────────────────────
# Tell setuptools to include ank_cinema_core.py as a single module
# (not a package folder — no __init__.py needed)
[tool.setuptools]
py-modules = ["ank_cinema_core"]

# ── Code quality tools (optional but good for GitHub) ────
[tool.black]
line-length    = 90
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 90
select      = ["E", "F", "W", "I"]
ignore      = ["E501", "E402", "F401", "W293", "W291", "E701", "F541", "I001"]

# ── Pytest ────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
